workflows:
  ios-primary:
    name: CineMap iOS Build
    max_build_duration: 60
    environment:
      flutter: 3.19.6
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build iOS simulator (no signing needed)
        script: flutter build ios --simulator --debug
    artifacts:
      - build/ios/iphonesimulator/Runner.app
    publishing:
      email:
        recipients:
          - karagodin.kirill.1991@gmail.com
        notify:
          success: true
          failure: true

  android-build:
    name: CineMap Android Build
    max_build_duration: 60
    environment:
      flutter: 3.19.6
      xcode: latest
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build Android APK
        script: flutter build apk --debug
    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk
    publishing:
      email:
        recipients:
          - karagodin.kirill.1991@gmail.com
        notify:
          success: true
          failure: true
